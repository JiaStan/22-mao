<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffd6e8">
<title>毕业快乐 · 月薪喵祝你前程似锦</title>
<link rel="icon" href="assets/cat-mascot.jpg?favicon=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff8fb1;
    --pink-soft:#ffd6e8;
    --mint:#9be7c4;
    --yellow:#ffe066;
    --lav:#c5b3ff;
    --ink:#3a2a4d;
    --paper:#fff7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 15%, #ffe9f3 0, transparent 40%),
      radial-gradient(circle at 85% 20%, #e6fff0 0, transparent 45%),
      radial-gradient(circle at 70% 90%, #fff3d6 0, transparent 40%),
      linear-gradient(180deg,#fff7fb 0%, #f3edff 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(58,42,77,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,42,77,.04) 1px, transparent 1px);
    background-size:24px 24px;
    pointer-events:none;z-index:0;
  }
  .pixel-font{font-family:'Press Start 2P',monospace;letter-spacing:1px}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .confetti{
    position:absolute;top:-20px;width:10px;height:14px;
    image-rendering:pixelated;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-20px) rotate(0deg);opacity:1}
    100%{transform:translateY(105vh) rotate(540deg);opacity:.9}
  }

  .wrap{
    position:relative;z-index:10;
    max-width:560px;margin:0 auto;
    padding:28px 18px 60px;
  }

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:#fff;
    padding:8px 14px;font-size:11px;
    box-shadow:0 4px 0 #1f1530;
    border-radius:4px;
    margin:0 auto 18px;
  }
  .badge .dot{width:8px;height:8px;background:var(--yellow);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}

  .center{text-align:center}

  .card{
    background:var(--paper);
    border:4px solid var(--ink);
    border-radius:14px;
    box-shadow:0 8px 0 var(--ink), 0 14px 22px rgba(58,42,77,.18);
    padding:22px 18px;
    margin-bottom:22px;
    position:relative;
  }
  .card::after{
    content:"";position:absolute;inset:6px;
    border:2px dashed rgba(58,42,77,.18);
    border-radius:8px;pointer-events:none;
  }

  .hero{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    margin-bottom:14px;
  }
  .hero .frame{
    width:180px;height:180px;
    background:var(--pink-soft);
    border:4px solid var(--ink);
    border-radius:18px;
    box-shadow:0 6px 0 var(--ink);
    overflow:hidden;
    position:relative;
    animation:bob 2.4s ease-in-out infinite;
  }
  .hero .frame img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .hero .name{
    margin-top:10px;
    background:var(--yellow);
    border:3px solid var(--ink);
    padding:5px 12px;border-radius:8px;
    font-size:14px;
    box-shadow:0 4px 0 var(--ink);
  }

  h1.title{
    font-family:'ZCOOL KuaiLe',sans-serif;
    font-size:34px;line-height:1.15;
    color:var(--ink);
    text-shadow:3px 3px 0 var(--pink);
    margin:8px 0 4px;
  }
  .sub{font-size:15px;color:#6c5b86;margin-bottom:6px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'ZCOOL KuaiLe',sans-serif;font-size:16px;
    color:var(--ink);
    background:var(--mint);
    border:3px solid var(--ink);
    border-radius:10px;
    padding:11px 18px;
    box-shadow:0 5px 0 var(--ink);
    cursor:pointer;
    transition:transform .08s, box-shadow .08s;
    user-select:none;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn.pink{background:var(--pink);color:#fff}
  .btn.yellow{background:var(--yellow)}
  .btn.full{width:100%}

  .player{
    display:flex;flex-direction:column;gap:12px;
  }
  .player .track{
    display:flex;align-items:center;gap:12px;
    background:#fff;border:3px solid var(--ink);border-radius:10px;
    padding:10px 12px;
    box-shadow:0 4px 0 var(--ink);
  }
  .cover{
    width:54px;height:54px;flex:0 0 54px;
    background:var(--lav);
    border:3px solid var(--ink);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    position:relative;overflow:hidden;
  }
  .cover.playing::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(45deg,rgba(255,255,255,.5),transparent 60%);
    animation:shine 1.6s linear infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .meta{flex:1;min-width:0}
  .meta .t{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{font-size:12px;color:#8a7aa3;margin-top:2px}
  .meta .a.empty{color:#c44}

  audio{width:100%}
  audio::-webkit-media-controls-panel{background:var(--pink-soft)}

  .controls{display:flex;gap:10px;flex-wrap:wrap}
  .controls .btn{flex:1;min-width:130px}

  .hint{font-size:12px;color:#8a7aa3;margin-top:6px;line-height:1.5}
  .hint b{color:#c44}

  .lyric{
    background:var(--ink);color:#fff;
    border-radius:8px;padding:10px 12px;
    font-size:14px;line-height:1.5;
    text-align:center;
    box-shadow:0 4px 0 #1f1530;
    min-height:42px;display:flex;align-items:center;justify-content:center;
  }
  .lyric .now{color:var(--yellow)}

  .wish{
    font-size:17px;line-height:1.7;
    color:var(--ink);
  }
  .wish .hi{color:var(--pink);font-size:20px}
  .wish .hl{background:linear-gradient(transparent 60%, var(--yellow) 60%);padding:0 2px}
  .wish .sign{display:block;margin-top:10px;text-align:right;color:#8a7aa3;font-size:14px}

  .divider{
    display:flex;justify-content:center;gap:6px;margin:6px 0;
  }
  .divider i{width:10px;height:10px;background:var(--pink);display:inline-block}
  .divider i:nth-child(2){background:var(--yellow)}
  .divider i:nth-child(3){background:var(--mint)}
  .divider i:nth-child(4){background:var(--lav)}
  .divider i:nth-child(5){background:var(--pink)}

  .float-star{position:fixed;font-size:18px;pointer-events:none;z-index:6;
    animation:twinkle 2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

  /* 居中的播放按钮（首次进入时可能被浏览器阻止自动播放） */
  .play-prompt{
    position:fixed;inset:0;z-index:9999;
    background:rgba(58,42,77,.85);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .4s;
  }
  .play-prompt.hide{opacity:0;pointer-events:none}
  .play-prompt .big-cat{
    font-size:80px;animation:bob 1.2s ease-in-out infinite;
  }
  .play-prompt .txt{
    color:#fff;font-size:20px;font-family:'ZCOOL KuaiLe';
  }
  .play-prompt .btn-play{
    font-size:20px;padding:16px 40px;
    background:var(--pink);color:#fff;
    border:4px solid #fff;border-radius:14px;
    box-shadow:0 6px 0 #c46;
  }

  @media (max-width:380px){
    h1.title{font-size:28px}
    .hero .frame{width:150px;height:150px}
  }
</style>
</head>
<body>

<div id="confetti"></div>

<!-- 首次进入页面的播放引导（很多手机浏览器禁止无交互的自动播放） -->
<div id="playPrompt" class="play-prompt">
  <div class="big-cat">🐱</div>
  <div class="txt">点一下，听月薪喵为你放《二十二》 ♪</div>
  <button class="btn btn-play" id="playBtn">▶ 点我播放</button>
</div>

<div class="wrap">

  <div class="center">
    <div class="badge pixel-font">
      <span class="dot"></span>
      <span>HAPPY GRADUATION</span>
    </div>
  </div>

  <!-- 主视觉卡 -->
  <div class="card">
    <div class="hero">
      <div class="frame"><img id="mascot" src="assets/cat-mascot.jpg?v=2" alt="月薪喵"></div>
      <div class="name pixel-font">月薪喵 · Mao</div>
    </div>

    <div class="center">
      <h1 class="title">毕业快乐！</h1>
      <p class="sub">恭喜你考入心仪的大学研究生 ✦</p>
    </div>

    <div class="divider"><i></i><i></i><i></i><i></i><i></i></div>

    <!-- 音乐播放器 -->
    <div class="player">
      <div class="track">
        <div class="cover" id="cover">🎵</div>
        <div class="meta">
          <div class="t" id="trackTitle">陶喆 — 二十二</div>
          <div class="a" id="trackArtist">献给闪闪发光的你 ♡</div>
        </div>
      </div>

      <!-- 默认加载 assets/music.mp3 -->
      <audio id="audio" preload="auto" src="assets/music.mp3" loop></audio>

      <div class="lyric" id="lyric">
        <span class="now">♪ 音乐响起来的那一刻，就是起点 ♪</span>
      </div>
    </div>
  </div>

  <!-- 祝福卡 -->
  <div class="card">
    <div class="wish">
      <span class="hi">嘿，朋友！</span><br>
      二十二岁的你，刚刚摘下学士帽，又要戴上新的光。<br>
      <span class="hl">考入心仪大学的研究生</span>，是努力给你的回信，也是未来写给你的序章。<br><br>
      愿你像月薪喵一样，每天都元气满满，<br>
      有梦可追，有钱可花，有人可爱。<br>
      二十二，正正好，一切都刚开始。🎓
      <span class="sign">— 你的朋友，永远站你这边</span>
    </div>
  </div>

  <div class="footer">
    Made with ♥ · 月薪喵像素小站<br>
    © 毕业季限定 · 祝前程似锦
  </div>

</div>

<script>
/* ---------- 强制刷新图片缓存 ---------- */
(function(){
  const ts=Date.now();
  const img=document.getElementById('mascot');
  if(img){
    img.src='assets/cat-mascot.jpg?t='+ts;
  }
  const audio=document.getElementById('audio');
  if(audio){
    audio.src='assets/music.mp3?t='+ts;
  }
})();

/* ---------- 彩带 ---------- */
(function(){
  const box=document.getElementById('confetti');
  const colors=['#ff8fb1','#ffe066','#9be7c4','#c5b3ff','#7fd8ff','#ffb37f'];
  const N=28;
  for(let i=0;i<N;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(3+Math.random()*4)+'s';
    c.style.animationDelay=(-Math.random()*6)+'s';
    c.style.width=(6+Math.random()*8)+'px';
    c.style.height=(10+Math.random()*8)+'px';
    box.appendChild(c);
  }
})();

/* ---------- 飘浮像素星 ---------- */
(function(){
  const chars=['★','✦','✧','♥'];
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='float-star';
    s.textContent=chars[i%chars.length];
    s.style.left=Math.random()*100+'vw';
    s.style.top=Math.random()*100+'vh';
    s.style.color=['#ff8fb1','#ffe066','#9be7c4','#c5b3ff'][i%4];
    s.style.animationDelay=(-Math.random()*2)+'s';
    document.body.appendChild(s);
  }
})();

/* ---------- 音乐播放 ---------- */
const audio=document.getElementById('audio');
const cover=document.getElementById('cover');
const lyricEl=document.getElementById('lyric');
const playPrompt=document.getElementById('playPrompt');
const playBtn=document.getElementById('playBtn');

// 尝试自动播放（部分手机可能被浏览器策略阻止）
function tryPlay(){
  audio.play().then(()=>{
    // 播放成功，隐藏引导层
    playPrompt.classList.add('hide');
    setTimeout(()=>playPrompt.style.display='none',500);
  }).catch(()=>{
    // 自动播放被阻止，保持引导层提示
    playPrompt.style.display='flex';
  });
}

// 页面加载后尝试自动播放
window.addEventListener('load', tryPlay);

// 用户点击引导按钮开始播放
playBtn.addEventListener('click',()=>{
  audio.play().catch(()=>{});
  playPrompt.classList.add('hide');
  setTimeout(()=>playPrompt.style.display='none',500);
});

// 用户交互解锁播放（有些浏览器在任何交互后都允许播放）
document.addEventListener('click', function once(){
  if(audio.paused) audio.play().catch(()=>{});
  document.removeEventListener('click',once);
},{once:true});

audio.addEventListener('play',()=>{
  cover.classList.add('playing');
});
audio.addEventListener('pause',()=>{
  cover.classList.remove('playing');
});

/* ---------- 动态歌词 ---------- */
const lyrics=[
  {t:0,    txt:'♪ 音乐响起来的那一刻，就是起点 ♪'},
  {t:12,   txt:'二十二岁的风，吹动学士帽的穗'},
  {t:24,   txt:'研究生的门在眼前打开'},
  {t:36,   txt:'愿你前路有星辰大海 ✦'},
  {t:48,   txt:'愿你像月薪喵，每天元气满满 🐱'},
  {t:60,   txt:'有梦可追，有钱可花，有人可爱 ♡'},
  {t:72,   txt:'二十二，正正好，一切都刚开始 🎓'},
  {t:84,   txt:'—— 敬闪闪发光的你！'}
];
let li=0;
audio.addEventListener('timeupdate',()=>{
  const ct=audio.currentTime;
  let idx=0;
  for(let i=lyrics.length-1;i>=0;i--){
    if(ct>=lyrics[i].t){idx=i;break;}
  }
  if(idx!==li){li=idx;renderLyric();}
});
function renderLyric(){
  lyricEl.innerHTML='<span class="now">'+lyrics[li].txt+'</span>';
}

/* ---------- 轻提示 ---------- */
function flash(msg){
  let t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#3a2a4d;color:#fff;padding:10px 16px;border-radius:8px;border:3px solid #ffe066;font-size:14px;z-index:99;box-shadow:0 4px 0 #1f1530;opacity:0;transition:opacity .2s';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.style.opacity='0',1800);
}
</script>
</body>
</html>
